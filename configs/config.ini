# Faceit Levels. Restart the map or the server after editing.

# Your FACEIT Data API key (server-side key): https://developers.faceit.com/
api_key=

# How often each player's level is fetched again, in minutes (1-1440).
refresh_minutes=60

# How long one FACEIT request may take, in seconds (1-60).
request_timeout_seconds=10

# How many FACEIT requests may run at the same time (1-16).
max_concurrent_requests=4
