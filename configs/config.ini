# FACEIT Data API key: https://developers.faceit.com/
api_key=

# Refresh each player's FACEIT level every 60 minutes.
refresh_minutes=60
request_timeout_seconds=10
max_concurrent_requests=4

# Current CS2 IGameResourceService offsets. Only change these after a CS2 update
# when a new Faceit Levels release or known-good offset is available.
game_entity_system_offset_windows=88
game_entity_system_offset_linux=80
